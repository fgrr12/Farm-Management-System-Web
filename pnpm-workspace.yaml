# PNPM Workspace Configuration
# This file defines the workspace structure for the Cattle farm management application

packages:
  # Main application package
  - '.'

  # Exclude build outputs and cache directories
  - '!**/node_modules'
  - '!**/dist'
  - '!**/build'
  - '!**/.next'
  - '!**/.nuxt'
  - '!**/.vite'
  - '!**/.cache'
  - '!**/.firebase'
  - '!**/.kiro'

# Catalog configuration for dependency management
catalog:
  # React ecosystem
  react: ^19.1.0
  react-dom: ^19.1.0
  '@types/react': ^19.1.8
  '@types/react-dom': ^19.1.6

  # Build tools
  vite: ^7.0.6
  typescript: ^5.8.3
  '@vitejs/plugin-react-swc': ^3.11.0

  # Testing
  vitest: ^3.2.4
  '@testing-library/react': ^16.3.0
  '@testing-library/jest-dom': ^6.6.3
  jsdom: ^26.1.0

  # Styling
  tailwindcss: ^4.1.11
  '@tailwindcss/vite': ^4.1.11
  daisyui: ^5.0.46
  unocss: ^66.3.3

  # Code quality
  '@biomejs/biome': 2.1.2

  # Firebase
  firebase: ^12.0.0

# Dependency resolution configuration
onlyBuiltDependencies:
  - '@firebase/util'

# Security overrides for transitive dependencies (GitHub Dependabot alerts)
overrides:
  lodash: ^4.17.23
  minimatch@>=5.0.0 <5.1.8: ^5.1.8
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  defu: ^6.1.5
  protobufjs: ^7.5.5
  fast-uri: ^3.1.1
  '@babel/plugin-transform-modules-systemjs': ^7.29.4
  '@protobufjs/utf8': ^1.1.1
  '@grpc/grpc-js': ^1.9.16
  esbuild: ^0.28.1
  # Reached only through workbox-build (vite-plugin-pwa), i.e. build-time tooling —
  # none of these ship in the client bundle. Pinned per major so the v1/v2 trees
  # each get their own patched line instead of being forced onto one version.
  brace-expansion@<1.1.18: ^1.1.18
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  minimatch@<3.1.4: ^3.1.4
  ajv@>=7.0.0 <8.18.0: ^8.18.0
  '@babel/core': ^7.29.1
  sharp@<0.35.0: ^0.35.0

# Shared settings across workspace
shared-workspace-lockfile: true
save-workspace-protocol: true
link-workspace-packages: true

# Node.js version requirement
engines:
  node: '>=22.0.0'
  pnpm: '>=10.0.0'

allowBuilds:
  '@firebase/util': false
  esbuild: set this to true or false
  msw: false
  protobufjs: false
  sharp: false
